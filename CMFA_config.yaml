# CMFA 适配版
mode: rule

proxy-providers:
  Airport1:
    url: "你的机场订阅链接"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
    path: ./proxies/airport1.yaml
    # 显式指定手机端存储路径

proxies:
  - {name: 直连, type: direct}

# 全局配置 
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning

# 手机端核心配置
profile:
  store-selected: true
  store-fake-ip: true

# 嗅探
sniffer:
  enable: true
  # 手机端建议开启，有助于分流更准确
  parse-pure-ip: true
  # 将嗅探到的域名还原回核心进行二次匹配
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.qq.com"
    - "+.weixin.com"
    - "+.huawei.com"
    - "+.mi.com"

# CMFA 的 TUN 入站配置
tun:
  enable: true
  stack: mixed
  # 手机端推荐 mixed 或 system
  auto-route: true
  # 手机端必须为 true 以接管流量
  auto-detect-interface: true
  dns-hijack:
    - "any:53"

# DNS 模块 (针对手机环境优化)
dns:
  enable: true
  cache-algorithm: arc
  listen: 127.0.0.1:1053
  # 手机端内部监听
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - 223.5.5.5
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
  nameserver:
    - https://8.8.8.8/dns-query#RULES
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"

# 策略组保持不变
proxy-groups:
  # 节点地区筛选
  #- {name: 🇭🇰 香港节点, type: select, include-all: true, filter: "(?i)(?=.*(港|HK|Hong))^((?!(台|日|韩|新|美)).)*$"}
  #- {name: 🇯🇵 日本节点, type: select, include-all: true, filter: "(?i)(?=.*(日|JP|Japan))^((?!(港|台|韩|新|美)).)*$"}
  #- {name: 🇰🇷 韩国节点, type: select, include-all: true, filter: "(?i)(?=.*(韩|KR|Korea))^((?!(港|台|日|新|美)).)*$"}
  #- {name: 🇸🇬 狮城节点, type: select, include-all: true, filter: "(?i)(?=.*(新加坡|SG|Singapore))^((?!(台|日|韩|美)).)*$"}
  #- {name: 🇺🇲 美国节点, type: select, include-all: true, filter: "(?i)(?=.*(美|US|America))^((?!(港|台|日|韩|新)).)*$"}
  #- {name: 🇹🇼 台湾节点, type: select, include-all: true, filter: "(?i)(?=.*(台|TW|Taiwan))^((?!(港|日|韩|新|美)).)*$"}

  # 自动测速选择
  - {name: ♻️ 香港自动, type: url-test, include-all: true, tolerance: 100, interval: 600, filter: "(?i)(?=.*(港|HK|Hong))^((?!(台|日|韩|新|美)).)*$"}
  - {name: ♻️ 日本自动, type: url-test, include-all: true, tolerance: 100, interval: 600, filter: "(?i)(?=.*(日|JP|Japan))^((?!(港|台|韩|新|美)).)*$"}
  - {name: ♻️ 韩国自动, type: url-test, include-all: true, tolerance: 100, interval: 600, filter: "(?i)(?=.*(韩|KR|Korea))^((?!(港|台|日|新|美)).)*$"}
  - {name: ♻️ 狮城自动, type: url-test, include-all: true, tolerance: 100, interval: 600, filter: "(?i)(?=.*(新加坡|SG|Singapore))^((?!(台|日|韩|美)).)*$"}
  - {name: ♻️ 台湾自动, type: url-test, include-all: true, tolerance: 100, interval: 600, filter: "(?i)(?=.*(台|TW|Taiwan))^((?!(港|日|韩|新|美)).)*$"}
  - {name: ♻️ 美国自动, type: url-test, include-all: true, tolerance: 100, interval: 600, filter: "(?i)(?=.*(美|US|America))^((?!(港|台|日|韩|新)).)*$"}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, tolerance: 100, interval: 600, filter: "^((?!直连).)*$"}
  - {name: 🌐 全部节点, type: select, include-all: true}

  - {name: 🚀 默认代理, type: select, proxies: [♻️ 狮城自动, ♻️ 日本自动, ♻️ 韩国自动, ♻️ 香港自动, ♻️ 美国自动, ♻️ 台湾自动, ♻️ 自动选择, 🌐 全部节点, 直连]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [♻️ 狮城自动, ♻️ 日本自动, ♻️ 韩国自动, ♻️ 香港自动, ♻️ 美国自动, ♻️ 台湾自动, ♻️ 自动选择, 🌐 全部节点, 直连]}
  - {name: AI, type: select, proxies: [♻️ 狮城自动, ♻️ 日本自动, ♻️ 韩国自动, ♻️ 香港自动, ♻️ 美国自动, ♻️ 台湾自动, ♻️ 自动选择, 🌐 全部节点]}
  - {name: whatsapp, type: select, proxies: [♻️ 狮城自动, ♻️ 日本自动, ♻️ 韩国自动, ♻️ 香港自动, ♻️ 美国自动, ♻️ 台湾自动, ♻️ 自动选择, 🌐 全部节点]}
  - {name: twitter, type: select, proxies: [♻️ 狮城自动, ♻️ 日本自动, ♻️ 韩国自动, ♻️ 香港自动, ♻️ 美国自动, ♻️ 台湾自动, ♻️ 自动选择, 🌐 全部节点]}
  - {name: microsoft, type: select, proxies: [直连, ♻️ 狮城自动, ♻️ 日本自动, ♻️ 韩国自动, ♻️ 香港自动, ♻️ 美国自动, ♻️ 台湾自动, ♻️ 自动选择, 🌐 全部节点]}

# 规则匹配
rules:
  - RULE-SET,private_ip,直连,no-resolve
  - RULE-SET,private_domain,直连
  - RULE-SET,selfdirect,直连
  - RULE-SET,ai_ip,AI
  - RULE-SET,ai_domain,AI
  - RULE-SET,whatsapp_domain,whatsapp
  - RULE-SET,whatsapp_ip,whatsapp
  - RULE-SET,twitter_domain,twitter
  - RULE-SET,twitter_ip,twitter
  - RULE-SET,microsoft_domain,microsoft
  - RULE-SET,selfproxy,🚀 默认代理
  - RULE-SET,cn_domain,直连
  - RULE-SET,cn_ip,直连
  - RULE-SET,geolocation-!cn,🚀 默认代理
  - MATCH,🐟 漏网之鱼
  
# 规则集
## type：可选http/file/inline  behavior：可选domain/ipcidr/classical format：可选yaml/text/mrs
rule-providers: 
  fakeipfilter_domain: {type: http, interval: 86400, behavior: domain, format: mrs, url: "https://raw.githubusercontent.com/wwqgtxx/clash-rules/release/fakeip-filter.mrs", path: ./rules/fakeip.mrs}
  private_domain: {type: http, interval: 86400, behavior: domain, format: mrs, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs", path: ./rules/private_domain.mrs}
  private_ip: {type: http, interval: 86400, behavior: ipcidr, format: mrs, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs", path: ./rules/private_ip.mrs}  
  selfproxy: {type: http, interval: 86400, behavior: classical, format: text, url: "https://raw.githubusercontent.com/simonwei999/clash/refs/heads/main/proxy1.list", path: ./rules/selfproxy.list}
  selfdirect: {type: http, interval: 86400, behavior: classical, format: text, url: "https://raw.githubusercontent.com/simonwei999/clash/refs/heads/main/direct1.list", path: ./rules/selfdirect.list}
